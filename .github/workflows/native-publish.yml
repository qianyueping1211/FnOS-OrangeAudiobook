name: Native FPK Build and Release
# Only the standard x86_64 native fnOS package is published.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild from the selected source ref, e.g. v2.0.7'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'assets/**'
      - 'scripts/prepare_branding.py'
      - '.github/ting-reader-fpk-native/**'
      - '.github/actions/**'
      - '.github/workflows/native-publish.yml'
      - '.github/workflows/quality.yml'
      - '.github/scripts/**'
    tags:
      - 'v*'

concurrency:
  group: native-fpk-${{ github.ref }}
  cancel-in-progress: true

env:
  FNPACK_VERSION: "1.2.3"
  FFMPEG_BUILD_VERSION: "8.1.2-2"
  TING_PLUGIN_STORE_VERSION: "2.0.4"

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require a new installable application version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' backend/Cargo.toml)"
          RELEASE_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")"
          LATEST_TAG="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' <<<"$RELEASE_JSON")"
          LATEST_TARGET="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["target_commitish"])' <<<"$RELEASE_JSON")"
          LATEST_VERSION="${LATEST_TAG#v}"
          LATEST_VERSION="${LATEST_VERSION%%-build.*}"
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            git fetch --no-tags --depth=1 origin "$LATEST_TARGET"
            NON_CI_CHANGES="$(git diff --name-only "$LATEST_TARGET"...HEAD | grep -Ev '^\.github/(actions|workflows)/' || true)"
            if [ -n "$NON_CI_CHANGES" ]; then
              echo "::error::当前应用版本 $CURRENT_VERSION 已经发布。以下应用或安装包内容有变化，请先提升 backend、frontend、FPK 清单和更新日志中的版本号："
              printf '%s\n' "$NON_CI_CHANGES"
              exit 1
            fi
            echo "::notice::本次只有 GitHub 构建配置变化，允许同应用版本重新验证；现有用户无需安装此构建。"
          else
            printf 'Release version check passed: %s -> %s\n' "$LATEST_VERSION" "$CURRENT_VERSION"
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          components: rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare and verify fixed application icons
        run: |
          python3 -m venv "$RUNNER_TEMP/orange-branding"
          "$RUNNER_TEMP/orange-branding/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/orange-branding/bin/python" scripts/prepare_branding.py

      - name: Resolve native TLS dependencies without upgrading locked packages
        shell: bash
        run: |
          set -euo pipefail
          cp backend/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo update --manifest-path backend/Cargo.toml --package ting_reader
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          before = tomllib.loads((Path(os.environ["RUNNER_TEMP"]) / "Cargo.lock.before").read_text())
          after = tomllib.loads(Path("backend/Cargo.lock").read_text())
          def entries(lock):
              return {(p["name"],p["version"],p.get("source","")):p.get("checksum") for p in lock["package"]}
          old, new = entries(before), entries(after)
          assert all(key in new and new[key] == value for key,value in old.items()), "Existing locked dependencies must not be upgraded"
          print("Native TLS lock resolved; all existing dependency versions and checksums retained.")
          PY

      - name: Normalize Rust formatting in GitHub
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          cargo fmt --all
          cd ..
          if ! git diff --quiet; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Release tags must already contain formatted Rust."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend frontend/public .github/ting-reader-fpk-native/ICON* .github/ting-reader-fpk-native/app/ui/images
            git commit -m "build: normalize source formatting and fixed Orange Audiobook icons"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: source
    with:
      source_ref: ${{ needs.source.outputs.sha }}
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  native:
    needs: source
    outputs:
      target: ${{ steps.release_context.outputs.target }}
      version: ${{ steps.release_context.outputs.version }}
      release_tag: ${{ steps.release_context.outputs.release_tag }}
    runs-on: ${{ matrix.runner }}
    container: rust:1.93.1-bookworm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86
            fpk_suffix: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Configure Git workspace for container steps
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Resolve release context
        id: release_context
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git ls-remote --exit-code origin "refs/tags/$REQUESTED_TAG" >/dev/null
            TARGET="formal"
            VERSION="${REQUESTED_TAG#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="beta"
            VERSION="beta"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET="formal"
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="formal"
            VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' backend/Cargo.toml)"
          else
            echo "Unsupported release trigger: ${{ github.event_name }} / ${{ github.ref_type }}"
            exit 1
          fi

          if [ "$TARGET" = formal ]; then
            SOURCE_VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' backend/Cargo.toml)"
            if [ "$SOURCE_VERSION" != "$VERSION" ]; then
              echo "::error::Source version $SOURCE_VERSION does not match release version $VERSION"
              exit 1
            fi
          fi

          RELEASE_TAG="v$VERSION"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            RELEASE_TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Resolved $TARGET build for version $VERSION"
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake clang binutils sudo curl util-linux zstd
          rustup target add ${{ matrix.target }}
          getconf GNU_LIBC_VERSION

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          VITE_APP_BASE_URL=/app/ting-reader/ npm run build

      # A unique snapshot can be saved after every successful build. Reusing one
      # immutable primary key previously kept restoring an old registry-only cache.
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            backend/target
          key: native-target-v2-bookworm-rust1.93.1-x86_64-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-target-v2-bookworm-rust1.93.1-x86_64-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}-
            native-target-v2-bookworm-rust1.93.1-x86_64-
            v0-rust-native-x86_64-Linux-x64-

      - name: Build Backend
        run: |
          cd backend
          started=$SECONDS
          cargo build --locked --release --features native-fpk --target ${{ matrix.target }} --timings
          echo "Native backend compile: $((SECONDS-started)) seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiler timing report
        uses: actions/upload-artifact@v7
        with:
          name: native-compiler-timings
          path: backend/target/cargo-timings/
          if-no-files-found: error

      - name: Download pinned FFmpeg and FFprobe for server package
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              FFMPEG_ARCH="x86_64"
              FFMPEG_SHA256="58246304b840d40f600e7a03673695061d51ee864b11b35dbaa0983aa6506bc6"
              ;;
            aarch64-unknown-linux-gnu)
              FFMPEG_ARCH="arm64"
              FFMPEG_SHA256="c12dca8818065a1ad04023eecec3d2d44542b9c1095f13eb9b028fd224ac3d28"
              ;;
            *)
              echo "Unsupported FFmpeg target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          FFMPEG_ASSET="ffmpeg-8.1.2-audio-encode-${FFMPEG_ARCH}-linux-gnu.tar.gz"
          FFMPEG_ROOT="ffmpeg-8.1.2-audio-encode-${FFMPEG_ARCH}-linux-gnu"
          mkdir -p "$RUNNER_TEMP/ting-media/bin"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ffmpeg.tar.gz" \
            "https://github.com/dqsq2e2/ffmpeg-build/releases/download/v${FFMPEG_BUILD_VERSION}/${FFMPEG_ASSET}"
          echo "${FFMPEG_SHA256}  $RUNNER_TEMP/ffmpeg.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/ffmpeg.tar.gz" --strip-components=2 \
            -C "$RUNNER_TEMP/ting-media/bin" \
            "$FFMPEG_ROOT/bin/ffmpeg" "$FFMPEG_ROOT/bin/ffprobe"
          readelf -h "$RUNNER_TEMP/ting-media/bin/ffmpeg" | grep 'Machine:'

      - name: Prepare App Directory
        run: |
          mkdir -p .github/ting-reader-fpk-native/app/server
          mkdir -p .github/ting-reader-fpk-native/app/server/preinstalled-plugins
          echo "Listing target directory:"
          find backend/target -type f | grep "ting_reader" || true
          find backend/target -type f | grep "ting-reader" || true

          # Try to find binary with underscore (default for cargo) or hyphen
          BINARY_PATH=$(find backend/target -type f \( -name "ting_reader" -o -name "ting-reader" \) | grep "${{ matrix.target }}/release/ting[-_]reader$" | head -n 1)

          if [ -z "$BINARY_PATH" ]; then
            echo "Error: ting-reader binary not found in target directory!"
            exit 1
          fi

          echo "Found binary at: $BINARY_PATH"
          # Always copy as ting-reader (hyphen) to match scripts
          cp "$BINARY_PATH" .github/ting-reader-fpk-native/app/server/ting-reader
          mkdir -p .github/ting-reader-fpk-native/app/server/bin
          install -m 755 "$RUNNER_TEMP/ting-media/bin/"{ffmpeg,ffprobe} \
            .github/ting-reader-fpk-native/app/server/bin/
          .github/ting-reader-fpk-native/app/server/bin/ffmpeg -hide_banner -encoders \
            | grep 'libmp3lame'
          .github/ting-reader-fpk-native/app/server/bin/ffprobe -version

          cp backend/config.toml .github/ting-reader-fpk-native/app/server/
          cp -r frontend/dist .github/ting-reader-fpk-native/app/server/static
          curl --fail --location --retry 3 \
            "https://github.com/dqsq2e2/ting-reader-plugin-store/releases/download/v${TING_PLUGIN_STORE_VERSION}/ting-reader-plugin-store-${TING_PLUGIN_STORE_VERSION}.tr" \
            --output .github/ting-reader-fpk-native/app/server/preinstalled-plugins/ting-reader-plugin-store.tr
          cp backend/target/${{ matrix.target }}/release/fnos-updater .github/ting-reader-fpk-native/app/server/ting-reader-updater
          cp .github/ting-reader-fpk-native/cmd/setup_updater .github/ting-reader-fpk-native/app/server/setup_updater
          chmod +x .github/ting-reader-fpk-native/app/server/ting-reader-updater
          chmod +x .github/ting-reader-fpk-native/app/server/ting-reader
          chmod +x .github/ting-reader-fpk-native/cmd/*

      - name: Verify packaged server on Debian 12
        run: |
          set -euo pipefail
          SERVER_DIR=".github/ting-reader-fpk-native/app/server"
          for binary in "$SERVER_DIR/ting-reader" "$SERVER_DIR/bin/ffmpeg" "$SERVER_DIR/bin/ffprobe"; do
            required_glibc=$(readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1)
            echo "$binary requires $required_glibc"
            if [ "$(printf '%s\n' "$required_glibc" GLIBC_2.36 | sort -V | tail -n 1)" != "GLIBC_2.36" ]; then
              echo "::error::$binary requires a newer glibc than the fnOS Debian 12 baseline."
              exit 1
            fi
          done
          "$SERVER_DIR/ting-reader" --help
          "$SERVER_DIR/bin/ffmpeg" -hide_banner -version
          "$SERVER_DIR/bin/ffprobe" -hide_banner -version

      - name: Verify gateway-only startup and protected update APIs
        run: node .github/scripts/gateway-smoke.mjs .github/ting-reader-fpk-native/app/server/ting-reader

      - name: Verify lifecycle syntax
        run: |
          for script in .github/ting-reader-fpk-native/cmd/*; do bash -n "$script"; done

      - name: Verify root preparation and unprivileged application lifecycle
        run: bash .github/scripts/lifecycle-smoke.sh

      - name: Verify packaged application inside desktop and mobile windows
        run: |
          npm install --prefix "$RUNNER_TEMP/ting-window-tools" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/ting-window-tools/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/ting-window-tools/node_modules" node .github/scripts/iframe-smoke.cjs .github/ting-reader-fpk-native/app/server/ting-reader

      - name: Setup fnpack
        uses: ./.github/actions/setup-fnpack
        with:
          version: ${{ env.FNPACK_VERSION }}

      - name: Build FPK
        run: |
          VERSION="${{ env.VERSION }}"
          TARGET="${{ steps.release_context.outputs.target }}"

          if [ "$TARGET" = "beta" ]; then
            echo "Building for Beta release..."
            VERSION="beta"
            FN_OUTPUT="FnOS-OrangeAudiobook-${{ matrix.fpk_suffix }}-beta.fpk"
          else
            echo "Building for Formal release v$VERSION..."
            FN_OUTPUT="FnOS-OrangeAudiobook-${{ matrix.fpk_suffix }}-${VERSION}.fpk"
          fi

          # Update manifest with version
          sed -i "s/^version[[:space:]]*=.*/version = $VERSION/" .github/ting-reader-fpk-native/manifest

          # 删除可能已存在的 arch/platform 行
          sed -i "/^arch[[:space:]]*=/d" .github/ting-reader-fpk-native/manifest
          sed -i "/^platform[[:space:]]*=/d" .github/ting-reader-fpk-native/manifest

          # 确保文件末尾有换行，避免追加到行尾
          sed -i -e '$a\' .github/ting-reader-fpk-native/manifest

          # 在 version 行之后插入 platform 行
          sed -i "/^version[[:space:]]*=/a platform = ${{ matrix.arch }}" .github/ting-reader-fpk-native/manifest

          # fnpack 打包 (用目前中文版的)
          fnpack build --directory .github/ting-reader-fpk-native
          mv ting-reader.fpk "$FN_OUTPUT"


      - name: Verify FPK integrity and write release checksums
        run: |
          set -euo pipefail
          set -- FnOS-OrangeAudiobook-*.fpk
          if [ "$#" -ne 1 ] || [[ "$1" != FnOS-OrangeAudiobook-x86_64-*.fpk ]]; then
            echo "::error::Only the standard x86_64 fnOS package may be published."
            exit 1
          fi
          for package in "$@"; do
            .github/ting-reader-fpk-native/app/server/ting-reader-updater --verify "$package" "$VERSION"
          done
          python3 - <<'PY'
          import io, tarfile
          from pathlib import Path
          for package in Path('.').glob('FnOS-OrangeAudiobook-*.fpk'):
              with tarfile.open(package) as outer:
                  payload = outer.extractfile(next(member for member in outer.getmembers() if member.name.lstrip('./') == 'app.tgz'))
                  assert payload is not None
                  with tarfile.open(fileobj=io.BytesIO(payload.read())) as app:
                      names = [member.name.lstrip('./') for member in app.getmembers()]
                      assert not any(name.startswith('image/') or name.endswith('/poster.png') for name in names)
                      required = ['ui/images/icon_%d.png' % size for size in (16,24,48,64,72,96,128,256)]
                      assert all(name in names for name in required)
          print('Verified documentation artwork is excluded and fixed fnOS icon sizes are present.')
          PY
          sha256sum FnOS-OrangeAudiobook-*.fpk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: native-fpk-x86_64
          path: |
            FnOS-OrangeAudiobook-*.fpk
            SHA256SUMS.txt


  release:
    needs: [source, quality, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.native.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: native-fpk-x86_64
      - name: Verify build outputs before publishing
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          test -f "FnOS-OrangeAudiobook-x86_64-${VERSION}.fpk"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ needs.source.outputs.sha }}"
          fi
      - name: Update Beta Tag
        if: needs.native.outputs.target == 'beta'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -f beta
          git push origin beta --force

      - name: Release Beta FPK
        uses: softprops/action-gh-release@v2
        if: needs.native.outputs.target == 'beta'
        with:
          tag_name: beta
          name: Beta Release
          body: "Latest beta build of ting-reader native FPK."
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            FnOS-OrangeAudiobook-x86_64-beta.fpk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Notes
        if: needs.native.outputs.target == 'formal'
        run: |
          set -euo pipefail
          awk -v header="## [${VERSION}]" '
            index($0, header " - ") == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Release Formal FPK
        uses: softprops/action-gh-release@v2
        if: needs.native.outputs.target == 'formal'
        with:
          tag_name: ${{ needs.native.outputs.release_tag }}
          target_commitish: ${{ needs.source.outputs.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            FnOS-OrangeAudiobook-x86_64-${{ env.VERSION }}.fpk
            SHA256SUMS.txt
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize build bottlenecks
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100
            });
            const seconds = (a,b) => a && b ? Math.round((Date.parse(b)-Date.parse(a))/1000) : null;
            const rows = jobs.filter(job => job.started_at && job.completed_at).map(job => [
              job.name, seconds(job.started_at,job.completed_at) + ' 秒', job.conclusion
            ]);
            const steps = jobs.flatMap(job => (job.steps || []).filter(step => step.started_at && step.completed_at)
              .map(step => ({name: job.name + ' / ' + step.name, duration: seconds(step.started_at,step.completed_at)})))
              .sort((a,b) => b.duration-a.duration).slice(0,8);
            await core.summary.addHeading('构建耗时')
              .addTable([[{data:'阶段',header:true},{data:'耗时',header:true},{data:'结果',header:true}], ...rows])
              .addHeading('最慢步骤',2)
              .addTable([[{data:'步骤',header:true},{data:'耗时',header:true}], ...steps.map(step => [step.name,step.duration+' 秒'])])
              .write();
