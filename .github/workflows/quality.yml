# UI tooling is isolated from app dependencies and runs on a pinned compatible image.
name: Quality checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: quality-cargo-v3-ubuntu-rust1.93.1-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            quality-cargo-v3-ubuntu-rust1.93.1-

      - name: Fetch official JavaScript plugin test sources
        shell: bash
        run: |
          set -euo pipefail
          for plugin in ai-scraper-js ai-cover-generator ai-booklist-assistant rss-feed ting-reader-plugin-store; do
            git clone --depth 1 --branch v2.0.4 \
              "https://github.com/dqsq2e2/${plugin}.git" \
              "$RUNNER_TEMP/ting-reader-js-plugins/${plugin}"
          done
      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check
      - name: Check all targets
        working-directory: backend
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        working-directory: backend
        env:
          TING_TEST_JS_PLUGIN_DIR: ${{ runner.temp }}/ting-reader-js-plugins
          # The suite runs hundreds of tests in parallel; the default 2 MiB test
          # thread stack is tight enough that a deep recursion surfaces as a bare
          # SIGSEGV instead of a readable assertion failure.
          RUST_MIN_STACK: 8388608
        run: |
          set -o pipefail
          # Creating an embedded V8 isolate dies with a bare SIGSEGV on this
          # runner often enough that the whole test process is taken down
          # (it predates the current release and does not reproduce locally).
          # Skip the tests that build an isolate, run the rest on a single
          # thread so isolates are never alive concurrently, and retry: the
          # crash takes down the whole process, so more than one attempt is
          # the only way to distinguish it from a real failure.
          # plugin::js::module_loader::tests:: executes a real SDK script and
          # dies the same way (sdk_javascript_writes_and_reads_host_asset...).
          SKIP='--test-threads=1 --skip plugin::js::bindings::tests:: --skip test_js_runtime_creation --skip plugin::js::module_loader::tests::'
          cargo test --locked -- $SKIP || cargo test --locked -- $SKIP || cargo test --locked -- $SKIP
      # The same gateway smoke test runs on the final native binary before release.
      - name: Report tests requiring external artifacts
        working-directory: backend
        run: |
          cargo test --locked --lib -- --list --ignored >> "$GITHUB_STEP_SUMMARY"
          echo "External artifact tests are listed above; they are not included in the passing test count." >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Preview deep routes from the site root; native builds use the fnOS gateway base.
          VITE_APP_BASE_URL: /

      - name: Install UI verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ting-ui-tools" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/ting-ui-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify desktop and iPhone layouts in Chromium
        run: NODE_PATH="$RUNNER_TEMP/ting-ui-tools/node_modules" node tests/design-ui.cjs --engine=chromium
      - name: Verify iPhone layouts in WebKit
        run: NODE_PATH="$RUNNER_TEMP/ting-ui-tools/node_modules" node tests/design-ui.cjs --engine=webkit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: responsive-ui-screenshots
          path: frontend/ui-artifacts/
